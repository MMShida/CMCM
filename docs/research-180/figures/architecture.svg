<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" role="img" aria-label="Model architecture"><rect width="760" height="245" fill="white"/><g font-family="Arial, sans-serif"><rect x="170" y="8" width="420" height="58" rx="8" fill="#f0f5f9" stroke="#306ea2"/><text x="380" y="31" text-anchor="middle" font-size="15" fill="#203548">Shared Bailey reconstruction and stated assumptions</text><text x="380" y="52" text-anchor="middle" font-size="12" fill="#203548">A, B, A-Lite and A-Lite+ sample the full-house audience</text><path d="M380,66 L95,105" fill="none" stroke="#177567" stroke-width="1.5"/><rect x="10" y="105" width="170" height="90" rx="8" fill="#f4f7f9" stroke="#177567" stroke-width="1.5"/><text x="95" y="131" text-anchor="middle" font-size="14" fill="#177567">A-Lite+ · primary</text><text x="95" y="155" text-anchor="middle" font-size="11" fill="#177567">Original links, finite queues</text><text x="95" y="176" text-anchor="middle" font-size="11" fill="#177567">Physical guidance, local choice</text><path d="M380,66 L285,105" fill="none" stroke="#306ea2" stroke-width="1.5"/><rect x="200" y="105" width="170" height="90" rx="8" fill="#f4f7f9" stroke="#306ea2" stroke-width="1.5"/><text x="285" y="131" text-anchor="middle" font-size="14" fill="#306ea2">A · spatial check</text><text x="285" y="155" text-anchor="middle" font-size="11" fill="#306ea2">Rows, lanes, following gaps</text><text x="285" y="176" text-anchor="middle" font-size="11" fill="#306ea2">Spatial group constraints</text><path d="M380,66 L475,105" fill="none" stroke="#306ea2" stroke-width="1.5"/><rect x="390" y="105" width="170" height="90" rx="8" fill="#f4f7f9" stroke="#306ea2" stroke-width="1.5"/><text x="475" y="131" text-anchor="middle" font-size="14" fill="#306ea2">B · queue check</text><text x="475" y="155" text-anchor="middle" font-size="11" fill="#306ea2">Contracted walking network</text><text x="475" y="176" text-anchor="middle" font-size="11" fill="#306ea2">Coarser storage approximation</text><path d="M380,66 L665,105" fill="none" stroke="#725889" stroke-width="1.5"/><rect x="580" y="105" width="170" height="90" rx="8" fill="#f4f7f9" stroke="#725889" stroke-width="1.5"/><text x="665" y="131" text-anchor="middle" font-size="14" fill="#725889">C · optimal flow</text><text x="665" y="155" text-anchor="middle" font-size="11" fill="#725889">Capacity / transit benchmark</text><text x="665" y="176" text-anchor="middle" font-size="11" fill="#725889">Reduced flow population</text><text x="380" y="226" text-anchor="middle" font-size="13" fill="#203548">Shared inputs do not establish empirical calibration or make the predictions interchangeable.</text></g></svg>