<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="timeflow"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#306ea2"/></marker></defs><rect width="720" height="230" fill="white"/><g font-family="Arial, sans-serif"><text x="90" y="20" font-size="14" fill="#17324d" text-anchor="middle">t = 0Δt</text><circle cx="90" cy="70" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="90" y="75" font-size="15" fill="#17324d" text-anchor="middle">u</text><circle cx="90" cy="165" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="90" y="170" font-size="15" fill="#17324d" text-anchor="middle">v</text><path d="M110,70 L248,70" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><path d="M110,165 L248,165" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><path d="M105,85 L255,150" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="20" font-size="14" fill="#17324d" text-anchor="middle">t = 1Δt</text><circle cx="270" cy="70" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="270" y="75" font-size="15" fill="#17324d" text-anchor="middle">u</text><circle cx="270" cy="165" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="270" y="170" font-size="15" fill="#17324d" text-anchor="middle">v</text><path d="M290,70 L428,70" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><path d="M290,165 L428,165" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><path d="M285,85 L435,150" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="20" font-size="14" fill="#17324d" text-anchor="middle">t = 2Δt</text><circle cx="450" cy="70" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="450" y="75" font-size="15" fill="#17324d" text-anchor="middle">u</text><circle cx="450" cy="165" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="450" y="170" font-size="15" fill="#17324d" text-anchor="middle">v</text><path d="M470,70 L608,70" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><path d="M470,165 L608,165" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><path d="M465,85 L615,150" fill="none" stroke="#306ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="630" y="20" font-size="14" fill="#17324d" text-anchor="middle">t = 3Δt</text><circle cx="630" cy="70" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="630" y="75" font-size="15" fill="#17324d" text-anchor="middle">u</text><circle cx="630" cy="165" r="17" fill="#eff5f9" stroke="#306ea2"/><text x="630" y="170" font-size="15" fill="#17324d" text-anchor="middle">v</text><text x="360" y="213" font-size="13" fill="#17324d" text-anchor="middle">Horizontal: wait with finite storage. Diagonal: travel with finite capacity.</text></g></svg>
