<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#476779"/></marker></defs><rect width="960" height="310" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203548"><text x="25" y="28" font-size="21" font-weight="bold">Information changes intent; geometry controls execution</text><g fill="#eaf2f6" stroke="#6a889b"><rect x="20" y="65" width="210" height="85" rx="6"/><rect x="270" y="65" width="210" height="85" rx="6"/><rect x="530" y="65" width="180" height="85" rx="6"/><rect x="750" y="65" width="190" height="85" rx="6"/><rect x="270" y="205" width="440" height="70" rx="6"/></g><g font-size="17"><text x="35" y="92">Local observation</text><text x="35" y="118" font-size="14">Floor + range + sightline</text><text x="35" y="138" font-size="14">Visible queues / flow / closure</text><text x="285" y="92">Choice or accepted command</text><text x="285" y="118" font-size="14">Persistent preferences</text><text x="285" y="138" font-size="14">CM acceptance fixed at 0.8</text><text x="545" y="92">Destination intent</text><text x="545" y="118" font-size="14">May change mid-link</text><text x="545" y="138" font-size="14">No position jump</text><text x="765" y="92">Feasible next turn</text><text x="765" y="118" font-size="14">Connected node + open link</text><text x="765" y="138" font-size="14">Storage + gate credit</text><text x="288" y="230">Manager / public dynamic sign</text><text x="288" y="255" font-size="14">Local observations → delayed radio → delayed controller snapshot</text></g><g fill="none" stroke="#476779" stroke-width="2" marker-end="url(#a)"><path d="M230 108H263"/><path d="M480 108H523"/><path d="M710 108H743"/><path d="M375 205V158"/><path d="M845 155V290H125V158"/></g><text x="755" y="277" font-size="13">Movement creates new observations</text></g></svg>
